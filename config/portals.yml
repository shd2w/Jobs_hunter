  results_wanted: 30
  distance_km: 100

# ── Extra JobSpy providers (Tier 1) ──
# All providers the pinned python-jobspy supports. Every one is OFF by default:
# they are regionally scoped and several block automated access. Switch on one
# at a time and read the scan log. "Remote" here is a source flag, never proof
# that you are eligible from your country. Google Jobs currently fails upstream
# and Bayt/Glassdoor returned HTTP 403 in the repo's tests, so they stay off.
jobspy_providers:
  glassdoor:
    enabled: false
    locations: ["Germany", "Austria", "Switzerland"]
    scope_notice: "Germany/Austria/Switzerland; not Egypt/Oman/UAE. Returned 403 in earlier tests"
  bayt:
    enabled: false
    locations: ["United Arab Emirates", "Egypt", "Oman"]
    scope_notice: "Middle East board; returned 403 in earlier tests"
  zip_recruiter:
    enabled: false
    locations: ["USA"]
    country_indeed: "USA"
    is_remote: true
    scope_notice: "US/Canada remote; verify country eligibility"
  naukri:
    enabled: false
    locations: ["India"]
    country_indeed: "India"
    is_remote: true
    scope_notice: "India-focused remote; not Naukrigulf"
  bdjobs:
    enabled: false
    locations: ["Bangladesh"]
    country_indeed: "USA"   # JobSpy country enum lacks Bangladesh; provider fixes its own country
    is_remote: true
    scope_notice: "Bangladesh work-from-home; verify country eligibility"
  hellowork:
    enabled: false
    locations: ["France"]
    country_indeed: "France"
    is_remote: true
    scope_notice: "France full remote; verify country eligibility"
    pages: 2

# ── Extra public sources (Tier 2): employer ATS boards + remote-job feeds ──
# Master switch. Jobs found here go through the same title/location filters,
# dedup, scoring, CV and queue steps as every other source.
extra_sources:
  enabled: true
  # Employer boards. Add the companies YOU want to watch; the list ships empty
  # because a slug that does not exist just returns 404 (reported, harmless).
  #   kind: greenhouse | lever | ashby | smartrecruiters
  #   id:   the slug in the company's public careers URL
  ats: []
  #  - {kind: greenhouse, id: "examplecompany", name: "Example Company"}
  feeds:
    remotive:       {enabled: true, category: "software-dev"}   # max ~4 fetches/day (enforced: 6 h cooldown)
    jobicy:         {enabled: true}
    arbeitnow:      {enabled: true, region: "de"}
    remoteok:       {enabled: true}
    weworkremotely: {enabled: false}   # RSS URL not independently verified; try it and read the log
