# Project contract map - JobHunter (spec v0.1, sections 5.1 and 5.3)
# Maps the existing governance suite to framework concepts. The suite is preserved
# unchanged; this file only points at it. Agents never edit the mapped documents
# (changes go through GOV-02 section 9, owner only).
contract_map_version: 1

documents_root: docs/governance
