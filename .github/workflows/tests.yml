name: Python regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-scanners.lock
      - run: python -m pytest -q
      - name: Integrated preparation and learning smoke
        run: python qa/phase6h_smoke.py .
      - name: Primary Scrapling fetching runtime
        run: |
          python -c "from scrapling.fetchers import FetcherSession; from scrapling import Selector"
          python -m pip check
          python -m pytest tests/test_scrapling_engine.py tests/test_scrapling_transport.py -q
