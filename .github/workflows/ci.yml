name: CI

on:
  push:
    branches: [phase/00-foundations]
  pull_request:
    branches: [phase/00-foundations]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install system dependencies (Linux: WeasyPrint GTK/Pango runtime)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      - name: Install core lock (hash-checked, G7)
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Install ingestion lock (hash-checked)
        run: python -m pip install --require-hashes -r requirements-ingestion.txt

      - name: Install docs lock (hash-checked; currently a no-op)
        run: python -m pip install --require-hashes -r requirements-docs.txt

      - name: Install dev lock (pytest, pip-tools)
        run: python -m pip install --require-hashes --allow-unsafe -r requirements-dev.txt

      - name: Verify dependency consistency (pip check)
        run: python -m pip check

      - name: Run test suite (Linux, G1)
        if: runner.os == 'Linux'
        run: python -m pytest -q

      - name: Windows verification (G7, PCD-011)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts/verify_windows.ps1
