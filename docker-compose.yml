services:
  job-search:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./output:/app/output
      - ./config:/app/config
    restart: unless-stopped
    # Original six-hour collection loop, without implicit paid evaluation/CV edits.
    # No backend port is exposed. Use Codespaces/local loopback for the dashboard.
    command: ["sh", "-c", "while true; do python run_scan.py; sleep 21600; done"]
